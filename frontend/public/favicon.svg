<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="favText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#favBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" stroke="url(#favBorder)" stroke-width="4"/>

  <!-- Stylized "G" or "GUESS" -->
  <text x="64" y="68" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="url(#favText)" text-anchor="middle" letter-spacing="2">
    GUESS
  </text>
  <text x="64" y="98" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#fbbf24" text-anchor="middle">
    11
  </text>

  <!-- Paint Swoosh -->
  <path d="M 20 80 C 44 100, 84 102, 108 80" stroke="url(#favBorder)" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>