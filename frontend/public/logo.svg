<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="guessBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030508" stop-opacity="1"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="guessBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="75%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Paint Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#guessBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#guessBorder)" stroke-width="6" opacity="0.9"/>
  <rect x="26" y="26" width="460" height="460" rx="102" stroke="#ffffff" stroke-width="1.5" opacity="0.12"/>

  <!-- Ambient Paint Drops & Glow Spheres -->
  <g opacity="0.85" filter="url(#neonGlow)">
    <circle cx="95" cy="120" r="14" fill="#06b6d4" opacity="0.8"/>
    <circle cx="70" cy="165" r="7" fill="#38bdf8" opacity="0.9"/>
    <circle cx="420" cy="130" r="16" fill="#f59e0b" opacity="0.85"/>
    <circle cx="445" cy="175" r="8" fill="#fbbf24" opacity="0.8"/>
    <circle cx="110" cy="390" r="10" fill="#a855f7" opacity="0.75"/>
    <circle cx="410" cy="380" r="12" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Celebration Sparkles -->
  <g fill="#ffffff">
    <path d="M 120 180 Q 120 195 105 195 Q 120 195 120 210 Q 120 195 135 195 Q 120 195 120 180 Z" opacity="0.95"/>
    <path d="M 390 190 Q 390 202 378 202 Q 390 202 390 214 Q 390 202 402 202 Q 390 202 390 190 Z" opacity="0.9"/>
    <path d="M 256 70 Q 256 84 242 84 Q 256 84 256 98 Q 256 84 270 84 Q 256 84 256 70 Z" opacity="0.95"/>
  </g>

  <!-- Dynamic Swirling Paint Wave (behind text) -->
  <path d="M 60 290 C 100 370, 220 400, 310 360 C 400 320, 450 240, 430 160 C 410 90, 310 80, 240 110 C 160 140, 90 230, 140 330" 
        stroke="url(#strokeGrad)" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.45" filter="url(#neonGlow)"/>

  <!-- Stylized Giant "GUESS" Text -->
  <g filter="url(#heavyShadow)">
    <!-- 3D Bevel Offset Shadow -->
    <text x="256" y="278" 
          font-family="'Impact', 'Outfit', 'Arial Black', sans-serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#000000" 
          opacity="0.7" 
          transform="translate(4, 8)">
      GUESS
    </text>

    <!-- Main Text Fill with Vibrant Neon Gradient -->
    <text x="256" y="278" 
          font-family="'Impact', 'Outfit', 'Arial Black', sans-serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="url(#textGrad)">
      GUESS
    </text>

    <!-- Glowing Text Stroke Highlight -->
    <text x="256" y="278" 
          font-family="'Impact', 'Outfit', 'Arial Black', sans-serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          fill="none" 
          opacity="0.65">
      GUESS
    </text>
  </g>

  <!-- Foreground Paint Splash Wave Swoosh -->
  <path d="M 80 300 C 160 360, 340 370, 420 290" 
        stroke="url(#strokeGrad)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#neonGlow)"/>
  <path d="M 80 300 C 160 360, 340 370, 420 290" 
        stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Artist Stylus / Golden Brush dipping in paint -->
  <g transform="translate(360, 160) rotate(38) scale(0.85)" filter="url(#heavyShadow)">
    <!-- Brush Handle -->
    <path d="M 12 -120 L 26 -120 L 22 20 L 16 20 Z" fill="url(#guessBorder)"/>
    <!-- Ferrule (Silver) -->
    <rect x="14" y="20" width="12" height="24" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Bristles -->
    <path d="M 14 44 C 13 60, 20 80, 20 80 C 20 80, 27 60, 26 44 Z" fill="#f59e0b"/>
    <!-- Glowing Paint Drop Tip -->
    <circle cx="20" cy="85" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
  </g>

  <!-- Subtitle Tag: DRAW IT. SCORE 11. -->
  <g transform="translate(256, 420)" filter="url(#heavyShadow)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0d1424" stroke="url(#guessBorder)" stroke-width="2"/>
    <text x="0" y="5" font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="900" fill="#38bdf8" letter-spacing="3" text-anchor="middle">
      DRAW IT • SCORE 11
    </text>
  </g>
</svg>