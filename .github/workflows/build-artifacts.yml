name: Build Android APK and Upload Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build Android APK & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Generate Database Client
        run: npm run db:generate

      - name: Run Unit Tests
        run: npm run test

      - name: Build Web Application Bundle
        run: npm run build --workspace=frontend

      - name: Synchronize Capacitor Android Assets
        run: |
          cd frontend
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./GuessTheEleven.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheEleven-Android-APK
          path: ./GuessTheEleven.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "GUESS THE ELEVEN - Android APK (v1.0.0)"
          body: |
            ## 🎨 GUESS THE ELEVEN ⚡
            > **"DRAW IT. GUESS IT. SCORE 11."**

            ### 📱 How to Download and Install on Android Mobile:
            1. Click **`GuessTheEleven.apk`** below to download directly to your mobile phone.
            2. Tap the downloaded file in your Notification bar or Downloads folder.
            3. Tap **Install** (allow installation from this source if prompted).
            4. Launch and play with up to 11 players!
          files: ./GuessTheEleven.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
