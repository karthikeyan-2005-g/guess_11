name: Build Android APK and Upload Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build Android APK & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install

      - name: Generate Database Client
        run: npm run db:generate

      - name: Build Web Application Bundle
        run: npm run build --workspace=frontend

      - name: Sync Android Capacitor Assets
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./Guess11.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./GUESS.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./GuessTheEleven.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Guess11-Android-APK
          path: |
            ./Guess11.apk
            ./GUESS.apk
            ./GuessTheEleven.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "GUESS 11 - Android APK (v1.0.5 - App Name Updated to Guess 11)"
          body: |
            ## 🎨 GUESS 11 (v1.0.5) ⚡
            > **"DRAW IT. GUESS IT. SCORE 11."**

            ### 🚀 What's New in v1.0.5:
            - 📱 **Official App Icon Name**: Application name under the mobile home screen launcher icon updated to **"Guess 11"**!
            - 🔄 **Real-Time Room Sync**: Instant synchronization between mobile app and web browser players.
            - 👑 **Host Controls**: Instant "START GAME" button display when 2+ players connect.
            - ☁️ **24/7 Cloud Ready**: Permanent online multiplayer server on Render.

            ### 📲 How to Install:
            1. Under **Assets** below, tap **`Guess11.apk`** to download.
            2. Install the APK on your phone.
            3. Enjoy **Guess 11** with your friends!
          files: |
            ./Guess11.apk
            ./GUESS.apk
            ./GuessTheEleven.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            frontend/android/**/build/reports/
            ~/.gradle/daemon/**/*.log
