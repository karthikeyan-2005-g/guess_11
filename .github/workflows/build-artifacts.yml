name: Build Android APK and iOS IPA Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install

      - name: Generate Database Client
        run: npm run db:generate

      - name: Build Web Application Bundle
        run: npm run build --workspace=frontend

      - name: Sync Android Capacitor Assets
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p ./artifacts/android
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./artifacts/android/Guess11.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./artifacts/android/GuessTheEleven.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guess11-Android-APK
          path: ./artifacts/android/*
          retention-days: 30

  build-ios:
    name: Build iOS IPA Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Database Client
        run: npm run db:generate

      - name: Build Web Application Bundle
        run: npm run build --workspace=frontend

      - name: Sync iOS Capacitor Assets
        working-directory: frontend
        run: npx cap sync ios

      - name: Package Payload into IPA
        run: |
          mkdir -p ./Payload/"Guess 11.app" ./artifacts/ios
          cp -r frontend/ios/App/App/* ./Payload/"Guess 11.app"/
          zip -r -y ./artifacts/ios/Guess11.ipa ./Payload
          cp ./artifacts/ios/Guess11.ipa ./artifacts/ios/GuessTheEleven.ipa
          ls -lh ./artifacts/ios

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guess11-iOS-IPA
          path: ./artifacts/ios/*
          retention-days: 30

  release-all:
    name: Publish Android APK & iOS IPA to GitHub Releases
    needs: [build-android, build-ios]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Staging Directory
        run: mkdir -p ./release-dist

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Guess11-Android-APK
          path: ./release-dist

      - name: Download iOS Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Guess11-iOS-IPA
          path: ./release-dist

      - name: List Artifacts to be Released
        run: ls -la ./release-dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.11
          name: "GUESS 11 (v1.0.11) - Deep Midnight Navy & Emerald Theme"
          body: |
            ## 🎨 GUESS 11 (v1.0.11) ⚡
            > **"DRAW IT. GUESS IT. SCORE 11."**

            ### 🚀 What's New in v1.0.11:
            - 🌌 **Deep Midnight Navy & Vibrant Emerald Theme**: Redesigned with a stunning `#080e1a` midnight navy background, sleek `#111c35` cards, and high-contrast Emerald Green `#10b981` action buttons!
            - 🔤 **Ultra-Clean Modern Fonts**: Upgraded typography with **Plus Jakarta Sans** for mobile readability and **Poppins** for bold headings!
            - 🎯 **100% Exact Same Interface**: All pages, drawing tools, buttons, real-time multiplayer, and room settings are 100% preserved.
            - 🌐 **Universal Cloud Share Links**: WhatsApp, Telegram, and Copy Link automatically share the 24/7 online cloud link so friends can join from any phone/network!
            - ⚡ **Instant 1-Tap Join for Friends**: Friends who click an invite link can enter their player name and join the party in 1 second without typing emails or passwords!
            - 🔄 **Continuous 2-Second Room Polling**: Player list and slot updates are automatically synced every 2 seconds, ensuring 2+ players and the START GAME button show up immediately on all screens!
            - 👑 **Unbreakable Host Controls**: Host START GAME button activates reliably as soon as 2 players are connected.
            - 🤖 **Android APK & iOS IPA**: Both `Guess11.apk` and `Guess11.ipa` updated with the new theme and fonts!

            ---

            ### 📲 How to Install on iPhone (iOS):
            #### Method A: Direct Sideloading (.ipa)
            1. Download **`Guess11.ipa`** from the Assets below.
            2. **Using PC (Sideloadly / 3uTools)**:
               - Connect iPhone to PC with USB.
               - Open Sideloadly or 3uTools, drag and drop `Guess11.ipa`, enter your Apple ID, and install.
               - On iPhone, go to **Settings > General > VPN & Device Management** and tap **Trust**.
            3. **Using On-Device Tools (Scarlet / SideStore / TrollStore)**:
               - Import `Guess11.ipa` directly into Scarlet or TrollStore to install without PC!

            #### Method B: Instant Web App (No PC, 1-Tap Safari Install):
            1. Open Safari on iPhone and visit: **https://guess-the-eleven-umyl.onrender.com**
            2. Tap the **Share icon** `[ ⎋ ]` at the bottom.
            3. Tap **"Add to Home Screen"**.
            4. Enjoy fullscreen native gameplay with custom Guess 11 icon immediately!

            ---

            ### 🤖 How to Install on Android:
            1. Under **Assets** below, tap **`Guess11.apk`** to download.
            2. (If upgrading, uninstall previous version first to refresh launcher icon).
            3. Install and enjoy!
            3. **Using On-Device Tools (Scarlet / SideStore / TrollStore)**:
               - Import `Guess11.ipa` directly into Scarlet or TrollStore to install without PC!

            #### Method B: Instant Web App (No PC, 1-Tap Safari Install):
            1. Open Safari on iPhone and visit: **https://guess-the-eleven-umyl.onrender.com**
            2. Tap the **Share icon** `[ ⎋ ]` at the bottom.
            3. Tap **"Add to Home Screen"**.
            4. Enjoy fullscreen native gameplay with custom Guess 11 icon immediately!

            ---

            ### 🤖 How to Install on Android:
            1. Under **Assets** below, tap **`Guess11.apk`** to download.
            2. (If upgrading, uninstall previous version first to refresh launcher icon).
            3. Install and enjoy!
          files: |
            ./release-dist/Guess11.apk
            ./release-dist/GuessTheEleven.apk
            ./release-dist/Guess11.ipa
            ./release-dist/GuessTheEleven.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
