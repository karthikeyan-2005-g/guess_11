name: Build Android APK and Upload Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build Android APK & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install

      - name: Generate Database Client
        run: npm run db:generate

      - name: Build Web Application Bundle
        run: npm run build --workspace=frontend

      - name: Sync Android Capacitor Assets
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./GuessTheEleven.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./GUESS.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GUESS-Android-APK
          path: |
            ./GUESS.apk
            ./GuessTheEleven.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "GUESS - Android APK (v1.0.3 - 24/7 Live Cloud Connected)"
          body: |
            ## 🎨 GUESS (v1.0.3) ⚡
            > **"DRAW IT. GUESS IT. SCORE 11."**

            ### 🚀 What's New in v1.0.3:
            - ☁️ **Permanent 24/7 Live Cloud Server**: Pre-configured to automatically connect to **https://guess-the-eleven-umyl.onrender.com**!
            - 📱 **Zero Setup Required**: Install the APK and play from anywhere on mobile data (4G/5G) or Wi-Fi — no PC needed!
            - 🌐 **Web Game Live**: Play in browser at **https://guess-the-eleven-umyl.onrender.com**!

            ### 📲 How to Install & Play:
            1. Under **Assets** below, tap **`GUESS.apk`** to download directly to your mobile phone.
            2. Open the downloaded file and tap **Install**.
            3. Open GUESS on your phone — it connects automatically to the 24/7 cloud server!
            4. Register or Login and enjoy!
          files: |
            ./GUESS.apk
            ./GuessTheEleven.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            frontend/android/**/build/reports/
            ~/.gradle/daemon/**/*.log
