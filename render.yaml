services:
  - type: web
    name: guess-the-eleven
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
